<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PreRent — Premium car rental</title>
<meta name="description" content="PreRent: rent the car of your dreams with home delivery.">
<meta name="theme-color" content="#f1f2f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="scene" id="scene">
  <div class="steps"></div>
  <div class="sphere"></div>
  <div class="device-wrap">
    <div class="device" id="device">
      <div class="screen-clip">
        <div class="app" id="app"><div class="notch"></div></div>
      </div>
    </div>
  </div>
</main>

<div class="showcase" id="showcase" aria-hidden="true"></div>
<button class="sc-skip" id="skipIntro" type="button">Skip intro</button>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;font:16px sans-serif">PreRent needs JavaScript enabled.</p></noscript>
<script src="js/app.js"></script>
</body>
</html>
